[project]
name = "python-developer-final-project"
version = "0.1.0"
description = "Django REST backend for housing rentals (IT Career Hub LMS 271)"
requires-python = ">=3.14,<3.15"
dependencies = [
    "django>=5.2.8,<5.3",
    "djangorestframework>=3.16,<3.19",
    "djangorestframework-simplejwt>=5.5.1,<6",
    "drf-spectacular>=0.30,<0.31",
    "gunicorn>=27.0.1,<28",
    "mysqlclient>=2.2.7,<3",
    "python-dotenv>=1.1,<2",
]

[dependency-groups]
dev = [
    "ruff>=0.14,<1",
    "pytest>=8,<10",
    "pytest-django>=4.11,<5",
    "faker>=37,<41",
]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings"
python_files = ["test_*.py"]
testpaths = ["tests"]

[tool.ruff]
target-version = "py314"
line-length = 88

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
