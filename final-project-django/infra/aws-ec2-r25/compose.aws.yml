name: lms271-r25
services:
  db:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:?Required}
      MYSQL_USER: ${MYSQL_USER:?Required}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?Required}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Required}
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=\"$$MYSQL_ROOT_PASSWORD\" mysql -h 127.0.0.1 -uroot -Nse 'SELECT 1' >/dev/null"]
      interval: 5s
      timeout: 5s
      retries: 24
      start_period: 30s
    networks:
      - backend
  web:
    build:
      context: ../..
    init: true
    restart: unless-stopped
    environment:
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:?Required}
      DJANGO_DEBUG: "false"
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:?Required}
      MYSQL_DATABASE: ${MYSQL_DATABASE:?Required}
      MYSQL_USER: ${MYSQL_USER:?Required}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?Required}
      MYSQL_HOST: db
      MYSQL_PORT: "3306"
    command:
      - sh
      - -c
      - >-
        python manage.py migrate --noinput &&
        exec gunicorn config.wsgi:application --bind 0.0.0.0:8000
        --no-control-socket --workers 1 --threads 2 --timeout 60
        --access-logfile - --error-logfile -
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "127.0.0.1:18765:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/schema/', timeout=3).close()"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    networks:
      - backend
  proxy:
    image: nginx:1.28-alpine
    restart: unless-stopped
    depends_on:
      web:
        condition: service_healthy
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "0.0.0.0:80:80"
    networks:
      - backend
networks:
  backend:
volumes:
  mysql_data:
